[project]
name = "radioai"
version = "0.1.0"
description = "Radio AI - personal AI radio DJ (POC)"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "librosa>=0.10.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydub>=0.25",
    "pyrubberband>=0.3.0",
    "google-genai>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
