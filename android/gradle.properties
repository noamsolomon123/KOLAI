# Gradle JVM: the `java` on PATH is JDK 24, which Gradle does not support.
# Point Gradle at the Android Studio JBR (JDK 21). Forward slashes are used
# deliberately: Java .properties treats backslash as an escape char, so a
# Windows path with backslashes would be corrupted. Gradle accepts forward
# slashes for org.gradle.java.home on Windows.
org.gradle.java.home=C:/Program Files/Android/Android Studio3/jbr

# Performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
